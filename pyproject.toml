[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "researchguard-ml"
version = "0.1.2"
description = "Design-aware, auditable machine-learning evaluation for tabular research data"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Amadu Kamal", email = "amadukamal8@gmail.com"}]
requires-python = ">=3.10"
dependencies = ["numpy>=1.23", "pandas>=1.5", "scikit-learn>=1.2"]
keywords = ["machine learning", "cross-validation", "data leakage", "reproducibility",
            "epidemiology", "research methods"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

[project.urls]
Homepage = "https://github.com/kamaldeenjnr/researchguard-ml"
Issues = "https://github.com/kamaldeenjnr/researchguard-ml/issues"
Changelog = "https://github.com/kamaldeenjnr/researchguard-ml/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest", "tabulate"]
app = ["streamlit"]

[project.scripts]
researchguard = "researchguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
