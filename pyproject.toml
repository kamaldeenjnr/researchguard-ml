[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "researchguard-ml"
version = "0.1.0"
description = "Auditable machine learning evaluation for research data"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "scikit-learn"]

[project.optional-dependencies]
dev = ["pytest"]
app = ["streamlit"]

[project.scripts]
researchguard = "researchguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
