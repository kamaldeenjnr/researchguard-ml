<svg xmlns="http://www.w3.org/2000/svg" width="920" height="558" viewBox="0 0 920 558" role="img" aria-label="Optimism of random cross-validation by scenario and model. Large on synthetic data with recognisable patients (up to 0.18 AUC) and changing patterns (up to 0.13); near zero on controls and on real hospital data.">
